<head>

  <title>提示詞畫廊 - 懷舊台灣篇</title>
  <style>
    /* ===== 全域設定 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card-bg: #1e2130;
      --card-hover: #252840;
      --border: #2e3350;
      --accent: #7c6ff7;
      --accent2: #5bc8d4;
      --text-main: #e8eaf6;
      --text-sub: #9ba1c0;
      --btn-tw-bg: #3d3580;
      --btn-tw-hover: #5548b0;
      --btn-en-bg: #1e5a63;
      --btn-en-hover: #2a7d8a;
      --radius: 12px;
      --transition: 0.22s ease;

      /* ===== 可調整：圖片資料夾路徑 ===== */
      --img-folder: face;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
    }

    /* ===== 頁首 ===== */
    header {
      text-align: center;
      padding: 48px 24px 24px;
      background: linear-gradient(160deg, #12142099 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }

    header .subtitle {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: var(--text-sub);
    }

    header .subtitle a {
      color: var(--accent2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition);
    }
    header .subtitle a:hover { border-color: var(--accent2); }

    .img-count {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
    }

    /* ===== 圖片格線 ===== */
    main {
      padding: 28px 20px 60px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    /* ===== 圖片卡片 ===== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(124, 111, 247, 0.18);
      background: var(--card-hover);
    }

    .card__img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: zoom-in;
      background: #10111a;
    }

    .card__img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .card__img-wrap img.loaded { opacity: 1; }
    .card__img-wrap:hover img { transform: scale(1.06); }

    /* 圖片載入失敗時的佔位 */
    .card__img-wrap .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-sub);
      font-size: 0.75rem;
      background: #14161f;
      position: absolute;
      inset: 0;
    }
    .card__img-wrap { position: relative; }
    .card__img-wrap .img-placeholder svg { opacity: 0.35; }

    .card__info {
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card__title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.4;
    }

    .card__filename {
      font-size: 0.72rem;
      color: var(--text-sub);
      text-align: center;
      opacity: 0.7;
    }

    .card__btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 6px 4px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background var(--transition), transform 0.12s ease;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.96); }

    .btn--tw {
      background: var(--btn-tw-bg);
      color: #ccc8ff;
    }
    .btn--tw:hover { background: var(--btn-tw-hover); }

    .btn--en {
      background: var(--btn-en-bg);
      color: #b3efef;
    }
    .btn--en:hover { background: var(--btn-en-hover); }

    /* ===== Toast 通知 ===== */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 33, 55, 0.95);
      color: var(--text-main);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.88rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease, transform 0.28s ease;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(124, 111, 247, 0.3);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Lightbox 全畫面 ===== */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 16, 0.92);
      z-index: 1000;
      cursor: zoom-out;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #lightbox.active { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
      object-fit: contain;
      animation: lb-in 0.22s ease;
    }

    @keyframes lb-in {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    #lightbox-caption {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 38, 0.88);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.88rem;
      pointer-events: none;
    }

    #lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(30, 33, 55, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition);
      z-index: 1001;
      line-height: 1;
    }
    #lightbox-close:hover { background: var(--card-hover); }

    /* ===== 頁尾 ===== */
    footer {
      text-align: center;
      padding: 18px 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
      border-top: 1px solid var(--border);
      opacity: 0.7;
    }

    /* ===== RWD ===== */
    @media (max-width: 600px) {
      header { padding: 32px 16px 18px; }
      main { padding: 20px 12px 40px; }
      .gallery-grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .btn { font-size: 0.72rem; padding: 5px 2px; }
      .card__title { font-size: 0.85rem; }
    }
  </style>
</head>

 {"檔案名稱": "otw017", "主題": "復古花磚拼貼的浴室一角 Bathroom Corner with Retro Floral Tiles", "中文生圖用提示詞": "台灣老屋浴室內，牆面鋪設著色彩斑斕、圖案精緻的幾何復古花磚，與洗石子浴缸相接。銅色的古董水龍頭微微垂著水滴，浴缸裡盛著清澈的水。光線透過小窗灑在色彩豐富的花磚上，冷熱色調交融，精緻而懷舊。35mm鏡頭。", "English Prompt": "A corner of an old Taiwanese bathroom, walls adorned with colorful, patterned retro floral tiles meeting a pebble-washed bathtub. A vintage brass faucet with a slow drip, clear water in the tub. Soft window light illuminating the vibrant tiles. Exquisite and deeply nostalgic. 35mm lens, no text."},

 {"檔案名稱": "otw024", "主題": "三合院雨天的小天井 Small Courtyard in Sanheyuan on a Rainy Day", "中文生圖用提示詞": "細雨斜斜地飄落在三合院的天井中，雨水順著紅色瓦簷匯聚成線，滴落在長滿青苔的紅磚地面上。空氣中帶著濕潤的泥土與老木頭氣味，畫面色調偏冷，帶著一種台灣梅雨季節特有的安靜與思念。底片質感，無文字。", "English Prompt": "Fine rain falling diagonally into the small courtyard of a Sanheyuan, water dripping from red roof tiles onto the mossy red brick ground in streams. Wet earthy and old wood scent in the air. Cool-toned color palette, reflecting the quiet longing of Taiwan's rainy season. Analog film look, no text."},

 {"檔案名稱": "otw030", "主題": "磨石子洗衣槽與木水瓢 Terrazzo Washbasin and Wooden Dipper", "中文生圖用提示詞": "三合院後院一口巨大的戶外磨石子洗衣槽，槽內盛滿了清澈的水。一柄手柄磨得光滑的舊木水瓢靜靜漂浮在水面上，折射出天空的淡藍。四周是由紅磚圍繞的矮牆，透露出純樸的日常家務溫情。35mm鏡頭，Kodak Portra 400。", "English Prompt": "A large outdoor terrazzo washbasin in a Sanheyuan backyard, filled with clear water. A worn, smooth wooden water dipper floats on the surface, reflecting the pale blue sky. Low red brick walls surround the area, conveying a quiet and warm domestic feel. 35mm lens, Kodak Portra 400, no text."},
 {"檔案名稱": "otw031", "主題": "溪邊灌溉圳溝與野薑花 Irrigation Canal and Butterfly Gingers", "中文生圖用提示詞": "鄉間清澈的灌溉圳溝旁，盛開著成片潔白的野薑花。溪水在鵝卵石間潺潺流動，花朵散發出淡淡的清香，引來幾隻蜻蜓。陽光溫和地照亮花瓣與水面，呈現出台灣野外最自然、純淨的夏日記憶。Fujifilm Superia 400。", "English Prompt": "A clear countryside irrigation canal lined with wild white butterfly ginger flowers blooming in clusters. Water flowing gently over river stones, attracting dragonflies with its fragrance. Gentle sun rays illuminating the petals and water. Pure, natural summer nostalgia of Taiwan. Fujifilm Superia 400, no text."},

 {"檔案名稱": "otw033", "主題": "灶台旁的紅土磚牆 Red Clay Brick Wall by the Brick Stove", "中文生圖用提示詞": "在溫馨的廚房（灶腳）內，灶台一側是由未施釉的粗糙紅土磚砌成的牆面。牆上用大鐵釘掛著一柄乾枯的絲瓜絡與木製鍋鏟。微弱的火光從灶口溢出，照亮了紅磚上的粗糙質地。極具質樸溫度的感官畫面。底片質感。", "English Prompt": "Inside a cozy traditional kitchen, a wall built of unglazed raw red clay bricks next to the stove. A dried loofah sponge and a wooden spatula hang on the wall from iron nails. Warm fire glow flickering from the hearth, highlighting the textures of the bricks. Warm rustic scene. Film feel, no text."},

 {"檔案名稱": "otw035", "主題": "釀造陶甕的陰涼角落 Cool Corner with Brewing Clay Pots", "中文生圖用提示詞": "三合院的屋簷陰涼處，整齊地排列著數個巨大的深褐色陶製酒甕與醬油缸。甕身上有著手工捏製的粗糙紋理，角落長著幾朵綠色蕨類。陽光照不到這裡，顯得格外幽靜、清涼，散發著時光釀造的深沉氣味。35mm底片質感。", "English Prompt": "A shady spot under the eaves of a Sanheyuan, where several large dark brown clay pots for brewing wine or soy sauce are lined up. Handcrafted rough clay textures, small green ferns growing in the corner. Cool, quiet, and deeply nostalgic. 35mm film aesthetic, no text."},

 {"檔案名稱": "otw038", "主題": "榻榻米房與綠色紗門 Tatami Room with Green Screen Door", "中文生圖用提示詞": "從半開的綠色鋁製防蚊網紗門望進去，是一間鋪設著淡綠色榻榻米（疊蓆）的日式老房間。房間中央擺著一張低矮的圓形木桌，午後溫柔的斜光透過拉門射入，將榻榻米的草編紋理勾勒得無比細緻。寧靜、安詳。底片質感。", "English Prompt": "Looking through a half-open green aluminum screen door into a traditional room with light green tatami mats. A low wooden round table sits in the center. Gentle afternoon sun rays stream in, highlighting the woven straw texture of the tatami. Calm, peaceful interior. Vintage film look, no text."},
 {"檔案名稱": "otw039", "主題": "磚牆縫隙生長的小草花 Wild Tiny Flowers in Brick Wall Crevices", "中文生圖用提示詞": "一堵歷經風雨的紅磚牆，磚與磚之間的灰色水泥縫隙中，生長出一株頑強的小草，頂端綻放著一朵白色的小野花。微小的水珠懸掛在花瓣上，陽光將紅磚的顆粒質感照得無比清晰。微距鏡頭，Kodak Portra 400。", "English Prompt": "A macro shot of a weathered red brick wall, where a tiny green plant with a single white wild flower grows from the cement crevice. Tiny water droplets cling to the petal, sunlight highlighting the coarse texture of the red bricks. Shallow depth of field, Kodak Portra 400, no text."},
 {"檔案名稱": "otw040", "主題": "竹編籃子裡的紫紅蔥頭 Shallots in a Woven Bamboo Basket", "中文生圖用提示詞": "在灶腳的木窗台上，一個手工編織的淺竹籃裡盛滿了帶有乾燥外皮的紫紅色紅蔥頭。窗外是模糊的稻田景色，陽光照亮了蔥頭乾燥如紙的表皮，反射出淡雅的紅紫色調。充滿台灣傳統料理的靈魂與生活氣息。35mm鏡頭。", "English Prompt": "A shallow handcrafted bamboo basket filled with purple-red shallots with paper-dry skins, resting on a kitchen wooden window sill. Out-of-focus rice field scenery outside. Warm light highlighting the papery texture of the shallots. Authentic Taiwanese culinary essence. 35mm lens, no text."},
 {"檔案名稱": "otw041", "主題": "老屋瓦簷下的燕子巢 Swallows Nest under Old House Eaves", "中文生圖用提示詞": "在紅磚三合院的屋簷與木質梁柱交接處，一個由泥土和稻草築成的燕子巢。幾隻羽毛油亮的小燕子正探出頭來，旁邊停歇著一隻黑白相間的成燕。背景是瓦簷下的陰影與遠處明亮的藍天。溫馨而自然的和諧畫面。Kodak Gold 200。", "English Prompt": "A mud and straw swallow's nest built at the junction of the eaves and wooden beams of a red-brick Sanheyuan. Little swallows peeking out, an adult black-and-white swallow resting nearby. Dark wooden eaves contrasting with the bright blue sky. Warm and natural harmony. Kodak Gold 200, no text."},
 {"檔案名稱": "otw042", "主題": "磨石子扶手的古木階梯 Old Wooden Stairs with Terrazzo Handrail", "中文生圖用提示詞": "通往老洋樓二樓的狹窄木製樓梯，一側是光滑、帶著黃色與黑色碎石顆粒的磨石子扶手。樓梯踏板有些許磨損凹陷，角落堆積著溫柔的光影。空氣中彷彿能聞到老木頭與洗石子的安靜氣息。底片質感，candid photo，無字。", "English Prompt": "A narrow old wooden staircase leading upstairs, bounded by a smooth yellow-and-black flecked terrazzo handrail. The wooden steps are worn and slightly concave from age. Soft shadows gather in the corners. Quiet smell of old wood and polished stone. Nostalgic analog look, no text."},
 {"檔案名稱": "otw043", "主題": "廚房角落的老式保溫瓶 Old-fashioned Thermos Bottle in Kitchen Corner", "中文生圖用提示詞": "在老廚房的水泥台面上，放置著一只紅色塑料外殼、印有復古牡丹花圖案的老式玻璃內膽保溫瓶。旁邊是一只倒扣的藍色條紋瓷碗。背景是因常年柴火而燻黑的牆壁，這抹鮮艷的紅色顯得特別親切溫馨。Kodak Portra 400。", "English Prompt": "On a concrete kitchen counter, an old-fashioned thermos bottle with a red plastic casing printed with a vintage peony flower pattern. A blue-striped ceramic bowl sits upside down beside it. Background wall darkened by years of firewood soot. Warm, nostalgic kitchen corner. Kodak Portra 400, no text."},
 {"檔案名稱": "otw044", "主題": "竹竿上晾曬的絲瓜絡 Dried Loofah Sponge Drying on Bamboo Poles", "中文生圖用提示詞": "三合院側邊，幾根橫跨的竹竿上吊掛著數個已經完全曬乾、呈現淡黃色纖維網狀的天然絲瓜絡。陽光穿透絲瓜絡細密的孔洞，在黃土牆上投影出如蕾絲般精緻的陰影。畫面乾淨、溫暖、純樸。Fujifilm Superia 400。", "English Prompt": "Several pale yellow dried natural loofah sponges with intricate fibrous mesh structures hang from horizontal bamboo poles beside a Sanheyuan. Sunlight streams through the mesh holes, casting lace-like delicate shadows on the earthen wall. Clean, warm, rustic. Fujifilm Superia 400, no text."},
 {"檔案名稱": "otw045", "主題": "鄉村小廟的斑駁紅燈籠 Weathered Red Lanterns of Rural Temple", "中文生圖用提示詞": "一座位於村口的小型媽祖廟前，屋簷下懸掛著一排圓形的紅色布製燈籠。燈籠因長年風吹日曬而有些褪色和斑駁（無任何文字與圖案）。黃昏的微風中，燈籠輕輕搖曳，背後是深藍色的夜空與溫暖的廟宇黃光。35mm底片風格。", "English Prompt": "A row of round red fabric lanterns hanging under the eaves of a small rural temple at the village entrance. Faded and weathered from wind and sun, without any text or patterns. Lanterns sway gently in the dusk breeze against a deep indigo sky and warm temple glow. 35mm film style, no text."},
 {"檔案名稱": "otw046", "主題": "綠油油水稻秧苗與田埂 Lush Green Rice Seedlings and Field Paths", "中文生圖用提示詞": "一片無邊無際的翠綠水稻田，整齊的秧苗在水中挺立，倒映著雪白的雲朵。一條窄窄的泥土田埂穿過田野，田埂旁長滿了開著紫色小花的小草。微風吹過，綠浪滾滾，展現出台灣農村最經典、祥和的夏日地景。Kodak Gold 200。", "English Prompt": "A vast expanse of lush green rice paddies, neat seedlings standing in clear water reflecting fluffy white clouds. A narrow dirt field path cuts through the fields, lined with wild purple wildflowers. Waves of green rippling in the breeze. Serene and peaceful. Kodak Gold 200, no text."},
 {"檔案名稱": "otw047", "主題": "壓花玻璃窗上的細雨滴 Fine Raindrops on Patterned Begonia Glass", "中文生圖用提示詞": "台灣特有的海棠花紋壓花玻璃窗上，落滿了密密麻麻的小雨滴，窗外的綠色竹林變得模糊而寫意。窗框是斑駁的白漆木框，一顆雨水正順著玻璃的花紋緩緩滑落。畫面色彩單純，極具靜謐與雨天的憂鬱美學。底片質感。", "English Prompt": "Fine raindrops clinging to a Taiwanese begonia-patterned glass window pane, blurring the green bamboo forest outside into an impressionistic painting. Weathered white-painted wooden frame, a single teardrop of water sliding down the pattern. Intimate, quiet, rainy day mood. Film texture, no text."},
 {"檔案名稱": "otw048", "主題": "灶腳門檻旁的薪柴堆 Stack of Firewood by the Kitchen Threshold", "中文生圖用提示詞": "三合院廚房（灶腳）門口那道紅磚門檻旁，整齊地碼放著一疊劈好的龍眼木柴火。門檻上的漆面已經磨光，露出了紅磚最原始的土紅色。一隻黃色的橘貓正在柴堆旁蜷縮著睡覺，畫面溫馨而安詳。Kodak Portra 400，無文字。", "English Prompt": "Beside the red brick threshold of a traditional kitchen (灶腳) door, a neat stack of split longan firewood is piled. The worn threshold reveals the raw terracotta color of the brick. A ginger tabby cat sleeps curled up beside the woodpile. Warm, peaceful rural cottage life. Kodak Portra 400, no text."},
 {"檔案名稱": "otw049", "主題": "廢棄古老磚窯與野草 Abandoned Brick Kiln and Wild Grass", "中文生圖用提示詞": "一座已經廢棄、由紅磚砌成的拱形古老目仔窯，半掩在茂密的綠色野草與芒草之中。窯口的磚塊有些破損，藤蔓順著磚縫攀爬。陽光透過厚重的雲層灑下柔和的光芒，呈現出一種廢墟特有的時間沉澱與寂靜。Fujifilm Superia 400。", "English Prompt": "An abandoned traditional red-brick arch kiln half-buried in tall green wild grass and silvergrass. Some bricks at the kiln entrance are broken, overgrown with creeping vines. Soft light filtering through overcast clouds, capturing a serene, quiet beauty of relics. Fujifilm Superia 400, no text."},
 {"檔案名稱": "otw050", "主題": "鄉間土路的黃昏歸途 Walking Home on Dirt Path at Dusk", "中文生圖用提示詞": "一條蜿蜒在金黃稻田之間的泥土小路，兩旁長滿了毛茸茸的狗尾草。夕陽將天空染成一片溫暖的橘紅色，將稻田與泥土路鍍上一層金邊。遠處是黑瓦紅磚的三合院農舍冒出淡淡炊煙。極致的歸家祥和感。35mm鏡頭，Kodak Gold 200。", "English Prompt": "A winding dirt path cutting through golden rice paddies, lined with wild foxtail grass. Sunset painting the sky in warm orange and red, casting a golden rim on the fields and path. In the distance, faint kitchen smoke rises from a red-brick farmhouse. Ultimate peaceful homecoming. 35mm, Kodak Gold 200, no text."},
 {"檔案名稱": "otw051", "主題": "竹編謝籃與紅色剪紙花 Bamboo Gift Basket and Red Paper-cut Flowers", "中文生圖用提示詞": "三合院廳堂的木質神桌上，放置著一個精緻的雙層紅色竹編謝籃。籃蓋上貼著一張手工剪裁的圓形紅色「雙喜」剪紙（僅有幾何裝飾圖騰，無任何中文字）。神桌的深色木頭在燭光下閃爍著溫潤的光芒，肅穆而溫馨。底片風格。", "English Prompt": "An exquisite double-tiered red-lacquered woven bamboo gift basket resting on a dark wooden ancestral table in a Sanheyuan. The lid is decorated with a geometric red paper-cut flower ornament (no text/letters). Warm candlelight reflecting on the polished dark wood, solemn and warm. Film style, no text."},
 {"檔案名稱": "otw052", "主題": "三合院前嬉戲的米克斯幼犬 Mixed-breed Puppies playing in front of Sanheyuan", "中文生圖用提示詞": "在三合院空曠的水泥地上，兩隻土黃色與黑白相間的米克斯幼犬正在一隻舊木鞋旁互相追逐嬉戲。陽光溫柔地照在牠們毛茸茸的身體上，背景是斑駁的紅磚牆與木質大門。畫面生機勃勃卻又無比單純安詳。Kodak Portra 400。", "English Prompt": "Two mixed-breed puppies (one golden, one black-and-white) playfully chasing each other near an old wooden clog on the concrete courtyard of a Sanheyuan. Warm sun highlighting their fluffy fur, against weathered red brick walls and wooden doors. Vibrant yet deeply innocent and peaceful. Kodak Portra 400, no text."},
 {"檔案名稱": "otw053", "主題": "磚雕窗櫺透出的微弱燭光 Dim Candlelight through Carved Brick Window", "中文生圖用提示詞": "夜幕低垂，一棟古老磚造房屋的幾何鏤空磚雕窗櫺中，透出溫暖而微弱的黃色燭光。窗下堆放著一些陶罐，牆面上落滿了斑駁的夜色陰影。畫面寧靜而神秘，彷彿在訴說著牆內古老的故事。Candid photo，底片質感，無文字。", "English Prompt": "At dusk, a dim, warm yellow candlelight glows through the geometric hollowed brick-carved window of an old brick building. Clay jars sit quietly beneath the window, soft night shadows dancing on the wall. Quiet, mysterious, historical narrative. Analog film look, no text."},
 {"檔案名稱": "otw054", "主題": "菜園裡的竹架與木柵欄 Bamboo Trellis and Fences in Vegetable Garden", "中文生圖用提示詞": "三合院旁一處打理整齊的農家菜園，裡面插著一排排歪斜卻穩固的竹竿支架，攀爬著豆角藤蔓。菜園四周圍繞著低矮的老木柵欄，地面鋪滿了濕潤的黑色泥土。夕陽灑落，泛著清新的泥土與葉片芳香。Fujifilm Superia 400。", "English Prompt": "A well-kept vegetable garden next to a Sanheyuan, featuring rows of tilted but sturdy bamboo stakes support climbing bean vines. Enclosed by a low, weathered wooden fence, wet dark soil bed. Evening sun shining, fresh scent of earth and leaves. Fujifilm Superia 400, no text."},
 {"檔案名稱": "otw055", "主題": "田野旁廢置的舊牛車 Abandoned Ox Cart beside the Field", "中文生圖用提示詞": "一部古老的雙輪木製牛車，車輪是巨大的木幅條，半沉在田埂旁的雜草叢中。車身木質已經開裂、泛灰，記錄著幾十年的風雨。後方是無邊無際的綠色水稻田，整幅畫面呈現出滄桑而平靜的歷史厚重感。Kodak Gold 200，無文字。", "English Prompt": "An ancient two-wheeled wooden ox cart with large spoked wooden wheels, half-sunk in the wild grass beside a field ridge. The grey, cracked wood reflects decades of hard work. Endless green rice paddies stretch behind it. Heavy with history yet profoundly tranquil. Kodak Gold 200, no text."},
 {"檔案名稱": "otw056", "主題": "柑仔店內的彩色糖果玻璃罐 Colorful Candy Glass Jars in Retro Grocery Store", "中文生圖用提示詞": "老式柑仔店的深色木質櫃台上，整齊排列著數個巨大的圓形玻璃糖果罐，裡面裝滿了紅色、黃色與綠色的條紋糖果。一束午後的陽光穿過老舊的木門，照亮了玻璃罐，使其反射出如寶石般繽紛的光芒，安靜而夢幻。Kodak Portra 400。", "English Prompt": "Inside an old-fashioned grocery store, several large spherical glass jars filled with red, yellow, and green striped hard candies sit on a dark wooden counter. A beam of afternoon light shines through the wooden door, making the jars glow like vibrant gemstones. Dreamy nostalgia. Kodak Portra 400, no text."},
 {"檔案名稱": "otw057", "主題": "磨石子玄關上的黑木屐 Black Wooden Clogs on Terrazzo Entrance", "中文生圖用提示詞": "三合院廂房的磨石子玄關上，靜靜擺放著一雙帶有紅色皮帶的黑色木屐。磨石子地面呈現出黑、白、黃三色碎石相間的精緻紋理，門檻是洗石子工藝。這雙常穿的鞋子帶有一種隨時有人歸來的溫馨生活感。35mm鏡頭，無文字。", "English Prompt": "A pair of black wooden clogs with red leather straps rests on the terrazzo entrance of a Sanheyuan side room. The terrazzo floor has a detailed pattern of black, white, and yellow stone chips. A pebble-washed threshold. Warm, lived-in feel, waiting for someone to return. 35mm lens, no text."},
 {"檔案名稱": "otw058", "主題": "竹篩上鋪曬的碧綠茶葉 Green Tea Leaves drying on a Bamboo Sieve", "中文生圖用提示詞": "在高山農舍的陽台上，一個巨大的竹編平篩上鋪滿了剛剛採摘、呈現鮮亮碧綠色的茶葉。陽光照在茶葉柔軟的葉片上，葉脈清晰可見，散發出清新的茶香氣息。背景是遠處雲霧繞繞的藍色茶山。自然寫實，Fujifilm Superia 400。", "English Prompt": "A large flat woven bamboo sieve filled with freshly picked, bright emerald-green tea leaves drying on the veranda of a mountain farmhouse. Sunlight illuminating the soft leaves and detailed veins. Foggy blue tea plantations in the distant background. Natural realism, Fujifilm Superia 400, no text."},
 {"檔案名稱": "otw059", "主題": "三合院廂房的紅磚圓拱門 Red Brick Archway of Sanheyuan Side Room", "中文生圖用提示詞": "三合院主屋與廂房之間，一道由清水紅磚砌成的優美圓拱形過道門。拱門邊緣長著一些細小的青苔，過道彼端是一片陽光燦爛的菜園。拱門內的陰影與拱門外的明亮光線形成極佳的層次對比。35mm底片質感。", "English Prompt": "A graceful round archway built of red bricks connecting the main house and the wing of a Sanheyuan. Tiny moss patches along the brick joints of the arch, leading to a sun-drenched vegetable garden in the background. High contrast of light and shadow, cinematic 35mm film style, no text."},
 {"檔案名稱": "otw060", "主題": "瓦房頂上的夕陽餘暉 Sunset Glow on Old Tile-Roofed House", "中文生圖用提示詞": "金色的夕陽餘暉斜斜地照在紅磚老瓦房那層層疊疊的波浪形紅瓦屋頂上。屋瓦的邊緣在夕陽下閃爍著溫暖的紅金色光芒，一隻麻雀靜靜停在脊頭的瓦片上。天空是漸變的紫紅色。畫面寧靜而充滿詩意。Kodak Gold 200。", "English Prompt": "Golden sunset light grazing the wavy, overlapping red roof tiles of a traditional Taiwanese farmhouse. The edges of the tiles glow in warm red and gold, a single sparrow perched quietly on the ridge tile. Pastel violet and orange gradient sky. Serene, poetic, Kodak Gold 200, no text."},
 {"檔案名稱": "otw061", "主題": "覆滿青苔的古老石鋪路 Ancient Mossy Stone-paved Path", "中文生圖用提示詞": "一條蜿蜒在老竹林與紅磚矮牆之間的古老石鋪小路，不規則的花崗岩石塊縫隙間長滿了濕潤的綠色青苔。陽光穿過竹葉，在石路上灑下斑駁的圓形光點。空氣中瀰漫著竹林特有的清幽與寂靜。底片風格，無字。", "English Prompt": "An old stone-paved path winding between an ancient bamboo forest and a low red brick wall, with damp green moss growing between irregular granite slabs. Sunlight filtering through bamboo leaves, casting circular light spots on the stones. Serene, cool, and peaceful. Film style, no text."},

  /* =========================================================
   * 工具函式
   * ========================================================= */
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), CONFIG.toastDuration);
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // 降級方案
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-999px;left:-999px;opacity:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  /* =========================================================
   * Lightbox
   * ========================================================= */
  const lightbox     = document.getElementById("lightbox");
  const lightboxImg  = document.getElementById("lightbox-img");
  const lightboxCap  = document.getElementById("lightbox-caption");
  const lightboxClose= document.getElementById("lightbox-close");

  function openLightbox(src, title) {
    lightboxImg.src = src;
    lightboxImg.alt = title;
    lightboxCap.textContent = title;
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
    // 延遲清空避免閃爍
    setTimeout(() => { lightboxImg.src = ""; }, 300);
  }

  lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target === lightboxImg) closeLightbox(); });
  lightboxClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

  /* =========================================================
   * 建立圖片卡片
   * ========================================================= */
  function buildCard(item) {
    const filename = item["檔案名稱"];
    const title    = item["主題"];
    const twPrompt = item["中文生圖用提示詞"];
    const enPrompt = item["English Prompt"];
    const imgSrc   = `${CONFIG.imgFolder}/${filename}${CONFIG.imgExt}`;

    const card = document.createElement("div");
    card.className = "card";

    // 圖片區域
    const imgWrap = document.createElement("div");
    imgWrap.className = "card__img-wrap";
    imgWrap.title = "點擊放大";

    // 佔位（當圖片尚未載入或不存在時顯示）
    const placeholder = document.createElement("div");
    placeholder.className = "img-placeholder";
    placeholder.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>${filename}</span>`;
    imgWrap.appendChild(placeholder);

    const img = document.createElement("img");
    img.alt   = title;
    img.loading = "lazy";
    img.src   = imgSrc;

    img.addEventListener("load",  () => { img.classList.add("loaded"); placeholder.style.display = "none"; });
    img.addEventListener("error", () => { img.style.display = "none"; });

    imgWrap.appendChild(img);
    imgWrap.addEventListener("click", () => openLightbox(imgSrc, title));

    // 資訊區域
    const info = document.createElement("div");
    info.className = "card__info";

    const titleEl = document.createElement("div");
    titleEl.className = "card__title";
    titleEl.textContent = title;

    const filenameEl = document.createElement("div");
    filenameEl.className = "card__filename";
    filenameEl.textContent = filename;

    const btns = document.createElement("div");
    btns.className = "card__btns";

    const btnTW = document.createElement("button");
    btnTW.className = "btn btn--tw";
    btnTW.textContent = "tw Prompt";
    btnTW.title = twPrompt;
    btnTW.addEventListener("click", async () => {
      await copyToClipboard(twPrompt);
      showToast(CONFIG.toastTW);
    });

    const btnEN = document.createElement("button");
    btnEN.className = "btn btn--en";
    btnEN.textContent = "en Prompt";
    btnEN.title = enPrompt;
    btnEN.addEventListener("click", async () => {
      await copyToClipboard(enPrompt);
      showToast(CONFIG.toastEN);
    });

    btns.appendChild(btnTW);
    btns.appendChild(btnEN);

    info.appendChild(titleEl);
    info.appendChild(filenameEl);
    info.appendChild(btns);

    card.appendChild(imgWrap);
    card.appendChild(info);

    return card;
  }

  /* =========================================================
   * 初始化
   * ========================================================= */
  const gallery = document.getElementById("gallery");
  IMAGES.forEach(item => gallery.appendChild(buildCard(item)));

  document.getElementById("imgCount").textContent = `共 ${IMAGES.length} 張圖片`;
</script>
