  <style>
    /* ===== 全域設定 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card-bg: #1e2130;
      --card-hover: #252840;
      --border: #2e3350;
      --accent: #7c6ff7;
      --accent2: #5bc8d4;
      --text-main: #e8eaf6;
      --text-sub: #9ba1c0;
      --btn-tw-bg: #3d3580;
      --btn-tw-hover: #5548b0;
      --btn-en-bg: #1e5a63;
      --btn-en-hover: #2a7d8a;
      --radius: 12px;
      --transition: 0.22s ease;

      /* ===== 可調整：圖片資料夾路徑 ===== */
      --img-folder: clsa;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
    }

    /* ===== 頁首 ===== */
    header {
      text-align: center;
      padding: 48px 24px 24px;
      background: linear-gradient(160deg, #12142099 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }

    header .subtitle {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: var(--text-sub);
    }

    header .subtitle a {
      color: var(--accent2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition);
    }
    header .subtitle a:hover { border-color: var(--accent2); }

    .img-count {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
    }

    /* ===== 圖片格線 ===== */
    main {
      padding: 28px 20px 60px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    /* ===== 圖片卡片 ===== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(124, 111, 247, 0.18);
      background: var(--card-hover);
    }

    .card__img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: zoom-in;
      background: #10111a;
    }

    .card__img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .card__img-wrap img.loaded { opacity: 1; }
    .card__img-wrap:hover img { transform: scale(1.06); }

    /* 圖片載入失敗時的佔位 */
    .card__img-wrap .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-sub);
      font-size: 0.75rem;
      background: #14161f;
      position: absolute;
      inset: 0;
    }
    .card__img-wrap { position: relative; }
    .card__img-wrap .img-placeholder svg { opacity: 0.35; }

    .card__info {
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card__title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.4;
    }

    .card__filename {
      font-size: 0.72rem;
      color: var(--text-sub);
      text-align: center;
      opacity: 0.7;
    }

    .card__btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 6px 4px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background var(--transition), transform 0.12s ease;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.96); }

    .btn--tw {
      background: var(--btn-tw-bg);
      color: #ccc8ff;
    }
    .btn--tw:hover { background: var(--btn-tw-hover); }

    .btn--en {
      background: var(--btn-en-bg);
      color: #b3efef;
    }
    .btn--en:hover { background: var(--btn-en-hover); }

    /* ===== Toast 通知 ===== */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 33, 55, 0.95);
      color: var(--text-main);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.88rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease, transform 0.28s ease;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(124, 111, 247, 0.3);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Lightbox 全畫面 ===== */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 16, 0.92);
      z-index: 1000;
      cursor: zoom-out;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #lightbox.active { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
      object-fit: contain;
      animation: lb-in 0.22s ease;
    }

    @keyframes lb-in {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    #lightbox-caption {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 38, 0.88);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.88rem;
      pointer-events: none;
    }

    #lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(30, 33, 55, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition);
      z-index: 1001;
      line-height: 1;
    }
    #lightbox-close:hover { background: var(--card-hover); }

    /* ===== 頁尾 ===== */
    footer {
      text-align: center;
      padding: 18px 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
      border-top: 1px solid var(--border);
      opacity: 0.7;
    }

    /* ===== RWD ===== */
    @media (max-width: 600px) {
      header { padding: 32px 16px 18px; }
      main { padding: 20px 12px 40px; }
      .gallery-grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .btn { font-size: 0.72rem; padding: 5px 2px; }
      .card__title { font-size: 0.85rem; }
    }
  </style>

  /* =========================================================
   * 工具函式
   * ========================================================= */
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), CONFIG.toastDuration);
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // 降級方案
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-999px;left:-999px;opacity:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  /* =========================================================
   * Lightbox
   * ========================================================= */
  const lightbox     = document.getElementById("lightbox");
  const lightboxImg  = document.getElementById("lightbox-img");
  const lightboxCap  = document.getElementById("lightbox-caption");
  const lightboxClose= document.getElementById("lightbox-close");

  function openLightbox(src, title) {
    lightboxImg.src = src;
    lightboxImg.alt = title;
    lightboxCap.textContent = title;
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
    // 延遲清空避免閃爍
    setTimeout(() => { lightboxImg.src = ""; }, 300);
  }

  lightbox.addEventListener("click", e => { if (e.target === lightbox || e.target === lightboxImg) closeLightbox(); });
  lightboxClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

  /* =========================================================
   * 建立圖片卡片
   * ========================================================= */
  function buildCard(item) {
    const filename = item["檔案名稱"];
    const title    = item["主題"];
    const twPrompt = item["中文生圖用提示詞"];
    const enPrompt = item["English Prompt"];
    const imgSrc   = `${CONFIG.imgFolder}/${filename}${CONFIG.imgExt}`;

    const card = document.createElement("div");
    card.className = "card";

    // 圖片區域
    const imgWrap = document.createElement("div");
    imgWrap.className = "card__img-wrap";
    imgWrap.title = "點擊放大";

    // 佔位（當圖片尚未載入或不存在時顯示）
    const placeholder = document.createElement("div");
    placeholder.className = "img-placeholder";
    placeholder.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>${filename}</span>`;
    imgWrap.appendChild(placeholder);

    const img = document.createElement("img");
    img.alt   = title;
    img.loading = "lazy";
    img.src   = imgSrc;

    img.addEventListener("load",  () => { img.classList.add("loaded"); placeholder.style.display = "none"; });
    img.addEventListener("error", () => { img.style.display = "none"; });

    imgWrap.appendChild(img);
    imgWrap.addEventListener("click", () => openLightbox(imgSrc, title));

    // 資訊區域
    const info = document.createElement("div");
    info.className = "card__info";

    const titleEl = document.createElement("div");
    titleEl.className = "card__title";
    titleEl.textContent = title;

    const filenameEl = document.createElement("div");
    filenameEl.className = "card__filename";
    filenameEl.textContent = filename;

    const btns = document.createElement("div");
    btns.className = "card__btns";

    const btnTW = document.createElement("button");
    btnTW.className = "btn btn--tw";
    btnTW.textContent = "tw Prompt";
    btnTW.title = twPrompt;
    btnTW.addEventListener("click", async () => {
      await copyToClipboard(twPrompt);
      showToast(CONFIG.toastTW);
    });

    const btnEN = document.createElement("button");
    btnEN.className = "btn btn--en";
    btnEN.textContent = "en Prompt";
    btnEN.title = enPrompt;
    btnEN.addEventListener("click", async () => {
      await copyToClipboard(enPrompt);
      showToast(CONFIG.toastEN);
    });

    btns.appendChild(btnTW);
    btns.appendChild(btnEN);

    info.appendChild(titleEl);
    info.appendChild(filenameEl);
    info.appendChild(btns);

    card.appendChild(imgWrap);
    card.appendChild(info);

    return card;
  }

  /* =========================================================
   * 初始化
   * ========================================================= */
  const gallery = document.getElementById("gallery");
  IMAGES.forEach(item => gallery.appendChild(buildCard(item)));

  document.getElementById("imgCount").textContent = `共 ${IMAGES.length} 張圖片`;
</script>
</body>
</html>
